<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign In · Zenmart</title>
    <meta name="theme-color" content="#443297" />
    <link rel="icon" href="../public/images/icons/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&display=swap" rel="stylesheet" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="../public/css/command.css" />
    <link rel="stylesheet" href="../public/css/account.css" />
  </head>
  <body data-page="login" data-root="../">
    <div data-zm="header"></div>

    <main id="main" class="auth_page">
      <div class="container">
        <ol class="page_router">
          <li><a href="../index.html">Home</a></li>
          <li><span aria-current="page">Sign In</span></li>
        </ol>
        <section class="auth_card" aria-labelledby="auth-title">
          <h1 id="auth-title">Sign In</h1>
          <p class="auth_sub">Welcome back. Sign in to see your orders, wishlist and saved addresses.</p>

          <form id="login-form" class="auth_form" novalidate>
            <div class="field">
              <label for="identifier">Username or email address <span class="req" aria-hidden="true">*</span></label>
              <input id="identifier" name="identifier" autocomplete="username" placeholder="e.g. alitufan or ali@example.com" data-rules="required" />
            </div>
            <div class="field">
              <label for="password">Password <span class="req" aria-hidden="true">*</span></label>
              <div class="password_wrap">
                <input id="password" name="password" type="password" autocomplete="current-password" data-rules="required password" />
                <button type="button" data-toggle-password aria-label="Show password" aria-pressed="false"><i class="fa-regular fa-eye" aria-hidden="true"></i></button>
              </div>
            </div>
            <div class="auth_row">
              <label class="check"><input type="checkbox" name="remember" checked /><span>Remember me</span></label>
              <a class="auth_link" href="contact.html#faq">Lost your password?</a>
            </div>
            <button type="submit" class="btn btn_dark btn_block">Sign In</button>
          </form>

          <div class="auth_or"><span>or</span></div>
          <div class="social_auth" role="group" aria-label="Sign in with">
            <button type="button" class="social_btn" data-social><i class="fa-brands fa-google" aria-hidden="true"></i> Google</button>
            <button type="button" class="social_btn" data-social><i class="fa-brands fa-apple" aria-hidden="true"></i> Apple</button>
            <button type="button" class="social_btn" data-social><i class="fa-brands fa-facebook-f" aria-hidden="true"></i> Facebook</button>
          </div>
          <p class="auth_switch">Don’t have an account? <a href="signup.html">Create account</a></p>
          <p class="demo_note"><i class="fa-solid fa-circle-info" aria-hidden="true"></i> Demo store: any username and an 8+ character password sign you in. Nothing leaves your browser.</p>
        </section>
      </div>
    </main>

    <div data-zm="footer"></div>
    <script src="../public/js/data.js"></script>
    <script src="../public/js/app.js"></script>
  </body>
</html>
